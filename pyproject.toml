[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lms-notifier"
version = "0.1.0"
description = "Watches a Moodle LMS for pending submissions and sends reminders."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
lms-notifier = "lms_notifier.cli:main"

[tool.setuptools.packages.find]
include = ["lms_notifier*"]
