[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notlms"
version = "0.1.1"
description = "Local, private reminder dashboard for Moodle LMS deadlines."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
notlms = "notlms.cli:main"

[tool.setuptools.packages.find]
include = ["notlms*"]

[tool.setuptools.package-data]
notlms = ["ui/*.html"]
